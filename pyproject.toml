[project]
name = "audio-transcript"
version = "0.1.0"
description = "Local web app to transcribe long audio recordings using Parakeet TDT."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sherpa-onnx>=1.13",
    "soundfile>=0.12",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
audio-transcript = "audio_transcript.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audio_transcript*"]

[tool.setuptools.package-data]
audio_transcript = ["static/*"]

[tool.pytest.ini_options]
markers = [
    "local: tests that require local model files; skip in CI",
]
asyncio_mode = "auto"
